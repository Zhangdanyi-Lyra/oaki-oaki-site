<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#e9e7e0;color:#222}body{background-image:radial-gradient(#c7c6be .7px,transparent .7px);background-size:22px 22px}header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:15px;font-weight:700}header a{color:inherit;text-decoration:none}h1{position:absolute;top:28%;left:7%;font-size:clamp(28px,6vw,76px);line-height:.95;letter-spacing:-.07em;margin:0;max-width:570px}p{position:absolute;top:53%;left:7%;font-size:14px;max-width:250px}img{position:absolute;width:36%;max-width:400px;right:8%;top:20%;pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.toolbar{position:absolute;right:20px;bottom:18px;display:flex;gap:7px}.toolbar button{border:1px solid #333;background:#f8f7f2;border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:18px}.toolbar button[aria-pressed="true"]{background:#222;color:white}</style></head><body><header><span>oaki oaki!</span><a href="#">BACK HOME ↗</a></header><h1>Draw how today feels.</h1><p>No right way to make a mark. Oaki is here with you.</p><img src="assets/ink-cutout.png" alt="Ink oaki guardian"><canvas id="draw"></canvas><div class="toolbar"><button data-tool="pen" aria-label="Black paintbrush" aria-pressed="true">✎</button><button data-tool="pink" aria-label="Pink brush">●</button><button data-tool="eraser" aria-label="Erase">⌫</button><button data-tool="clear" aria-label="Clear drawing">×</button></div><script>const c=document.getElementById('draw'),ctx=c.getContext('2d');let tool='pen',drawing=false;function size(){const old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0);c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.drawImage(old,0,0,c.width,c.height)}size();onresize=size;function point(e){return[e.clientX*devicePixelRatio,e.clientY*devicePixelRatio]}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))};c.onpointermove=e=>{if(!drawing)return;ctx.lineTo(...point(e));ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=(tool==='eraser'?32:tool==='pink'?13:5)*devicePixelRatio;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=tool==='pink'?'#ef90a5':'#171717';ctx.stroke()};c.onpointerup=()=>drawing=false;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.tool==='clear'){ctx.clearRect(0,0,c.width,c.height);return}tool=b.dataset.tool;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))})</script></body></html>
