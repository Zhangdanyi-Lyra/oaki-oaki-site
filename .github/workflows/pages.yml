name: Deploy Oaki site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source package
        uses: actions/checkout@v4

      - name: Rebuild site from split archive
        run: |
          cat oaki-oaki-site.zip.chunk-* > oaki-oaki-site.zip
          mkdir _site
          unzip -q oaki-oaki-site.zip -d _site
          rm -rf _site/.git

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
